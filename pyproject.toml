[project]
name = "ollamadev-mcp-server"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==2.0.0rc1",
    "requests>=2.32.0",
]

[project.scripts]
serve = "server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
